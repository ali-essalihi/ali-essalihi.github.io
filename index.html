<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essalihi Mohammed Ali - Professeur d'Informatique</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 4rem 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 0.5rem 0;
            color: #2b3035;
        }
        h2 {
            font-size: 1.75rem;
            font-weight: 400;
            color: #495057;
            margin: 0 0 1.5rem 0;
        }
        .location {
            font-size: 1.25rem;
            color: #6c757d;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Essalihi Mohammed Ali</h1>
        <h2>Professeur d'Informatique</h2>
        <div class="location">📍 Fès, Morocco</div>
    </div>
</body>
</html>
